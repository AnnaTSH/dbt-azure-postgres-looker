version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Tables landed in the raw schema. On the dev target, dbt seeds load
      these from seeds/. On azure, Airbyte loads them and the seeds are disabled.
      Column names are the contract either loader has to meet.
    tables:
      - name: orders
        description: One row per Superstore order line.
        columns:
          - name: row_id
          - name: order_id
          - name: order_date
            description: Excel serial or a real date.
          - name: ship_date
            description: Excel serial or a real date.
          - name: ship_mode
          - name: customer_id
          - name: customer_name
          - name: segment
          - name: country_region
          - name: city
          - name: state
          - name: postal_code
            description: Unpadded code, or blank for Vermont.
          - name: region
          - name: product_id
          - name: category
          - name: sub_category
          - name: product_name
          - name: sales
          - name: quantity
          - name: discount
          - name: profit
      - name: returns
        description: Returned flag repeated once per line of the order. No line key.
        columns:
          - name: returned
          - name: order_id
      - name: people
        description: One regional manager per region.
        columns:
          - name: regional_manager
          - name: region
