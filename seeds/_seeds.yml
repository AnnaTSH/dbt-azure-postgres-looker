version: 2

seeds:
  - name: orders
    description: Order lines from data/Orders.xls. Dates are Excel serials. Postal codes are unpadded text.
    config:
      column_types:
        row_id: integer
        order_date: integer
        ship_date: integer
        postal_code: text
        sales: numeric(18,4)
        quantity: integer
        discount: numeric(18,4)
        profit: numeric(18,4)
    columns:
      - name: row_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null

  - name: returns
    description: Returned orders from data/Returns.xls. Order ids repeat; there is no line key.
    columns:
      - name: returned
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yes']
      - name: order_id
        tests:
          - not_null

  - name: people
    description: One regional manager per region, from data/People.xls.
    columns:
      - name: regional_manager
        tests:
          - not_null
      - name: region
        tests:
          - unique
          - not_null
